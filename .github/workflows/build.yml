name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check workspace version and release tag
        run: bash .github/scripts/check-release-version.sh "$GITHUB_REF"
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fel_switcher/Cargo.toml -- --check
      - run: cargo clippy --workspace --lib --bins --locked --features xfel_spi_nor/vendored -- -D warnings
      - name: Check Bash syntax
        run: |
          for script in .github/scripts/*.sh toolbox/*.sh web/build_web.sh fel_switcher/build.sh; do
            bash -n "$script"
          done

  assets:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, armv7a-none-eabi
      - name: Build browser bootlogo generator
        run: ./web/build_web.sh
      - name: Build and test FEL switcher
        run: |
          ./fel_switcher/build.sh
          cargo test --manifest-path fel_switcher/Cargo.toml --bin egon_pad --target x86_64-unknown-linux-gnu --locked
      - uses: actions/upload-artifact@v7
        with:
          name: f800-fel-switcher
          path: fel_switcher/target/fel_switcher.bin
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  build:
    needs: [validate, assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux-x86_64
            host: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            slug: macos-aarch64
            host: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            slug: windows-x86_64
            host: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify archive architecture
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          actual_host=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          [[ $actual_host == "$EXPECTED_HOST" ]] || { echo "Unexpected host: $actual_host" >&2; exit 1; }
      - name: Build native host tools
        run: cargo build --locked --release --workspace --features xfel_spi_nor/vendored
      - name: Test core library
        run: cargo test --locked -p aw-core --lib
      - name: Download FEL switcher
        uses: actions/download-artifact@v8
        with:
          name: f800-fel-switcher
          path: fel_switcher/target
      - name: Package (Linux / macOS)
        if: matrix.archive == 'tar.gz'
        env:
          PACKAGE_PLATFORM: ${{ matrix.slug }}
        run: |
          PKG=dist/f800-linux-tools-${PACKAGE_PLATFORM}
          mkdir -p "${PKG}/bin"
          cp README.md LICENSE "${PKG}/"
          cp toolbox/*.sh "${PKG}/"
          chmod +x "${PKG}"/*.sh
          cp target/release/dump_tool target/release/img_tool target/release/xfel_spi_nor "${PKG}/bin/"
          cp fel_switcher/target/fel_switcher.bin "${PKG}/"
          cargo metadata --locked --offline --no-deps --format-version 1 | jq -r '.packages[0].version' > "${PKG}/VERSION"
          tar -C dist -czf "${PKG}.tar.gz" "f800-linux-tools-${PACKAGE_PLATFORM}"
          (cd dist && shasum -a 256 "f800-linux-tools-${PACKAGE_PLATFORM}.tar.gz" > "f800-linux-tools-${PACKAGE_PLATFORM}.tar.gz.sha256")
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        env:
          PACKAGE_PLATFORM: ${{ matrix.slug }}
        run: |
          PKG=dist/f800-linux-tools-${PACKAGE_PLATFORM}
          mkdir -p "${PKG}/bin"
          cp README.md LICENSE "${PKG}/"
          cp toolbox/*.ps1 "${PKG}/"
          cp target/release/dump_tool.exe target/release/img_tool.exe target/release/xfel_spi_nor.exe "${PKG}/bin/"
          cp fel_switcher/target/fel_switcher.bin "${PKG}/"
          cargo metadata --locked --offline --no-deps --format-version 1 | jq -r '.packages[0].version' > "${PKG}/VERSION"
          powershell -NoProfile -Command '$ErrorActionPreference = "Stop"; Compress-Archive -LiteralPath ("dist/f800-linux-tools-" + $env:PACKAGE_PLATFORM) -DestinationPath ("dist/f800-linux-tools-" + $env:PACKAGE_PLATFORM + ".zip") -Force'
          (cd dist && sha256sum "f800-linux-tools-${PACKAGE_PLATFORM}.zip" > "f800-linux-tools-${PACKAGE_PLATFORM}.zip.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: f800-linux-tools-${{ matrix.slug }}
          path: |
            dist/f800-linux-tools-${{ matrix.slug }}.${{ matrix.archive }}
            dist/f800-linux-tools-${{ matrix.slug }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

